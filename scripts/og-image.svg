<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7c9f5" />
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- inner border frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20"
        fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" />

  <!-- brand top-left -->
  <circle cx="80" cy="84" r="6" fill="#818cf8" />
  <text x="98" y="90" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace"
        font-size="22" font-weight="700" letter-spacing="6" fill="#f4f4f5">NEROAL</text>

  <!-- label -->
  <text x="80" y="270" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace"
        font-size="28" font-weight="500" letter-spacing="2" fill="#818cf8">&lt; Backend &amp; DevOps Engineer /&gt;</text>

  <!-- name -->
  <text x="76" y="390" font-family="'Inter', 'DejaVu Sans', sans-serif"
        font-size="120" font-weight="700" letter-spacing="-3" fill="url(#title)">Neroal Wu</text>

  <!-- subtitle -->
  <text x="80" y="455" font-family="'Inter', 'DejaVu Sans', sans-serif"
        font-size="32" font-weight="400" fill="#a1a1aa">From development and CI/CD to deployment &amp; monitoring.</text>

  <!-- bottom meta -->
  <text x="80" y="545" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace"
        font-size="22" font-weight="400" letter-spacing="1" fill="#71717a">iOS Developer  ·  Published on the App Store</text>
</svg>
